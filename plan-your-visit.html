		<main> 
			<h1>Plan Your Visit to the Trail Stops</h1> 
			<p>Fill out the form(s) below and plan out a visit to one of these trail stops!</p> 
			<select>
				<optgroup label="Brewery">
					<option>Appleton Beer Factory</option> 
				</optgroup> 
				<optgroup label="Creamery"> 
					<option>Kelley Country Creamery</option> 
				</optgroup> 
			</select> 
			<fieldset>  
			<form action="/action_page.php">
				<legend>What Date is Your Visit?</legend> 
				<input type="radio" id="week" name="day"> 
				<label for="week">Weekday</label> 
				<input type="radio" id="weekend" name="day"> 
				<label for="weekend">Weekend</label> 
				<input type="date"> 
				<label for="date">Date</label>
				<input type="text" placeholder="Full Name"> 
				<label for="text">Text</label> 
				<input type="email" placeholder="for@contact.com"> 
				<label for="email">Email</label> 
				<input type="tel" placeholder="555-TEXT-CONTACT"> 
				<label for="tel">Phone Number</label> 
				<input type="text" name="Submit"> 
				<button type="submit">Submit</button>  
			</form> 
			</fieldset> 
		</main>
